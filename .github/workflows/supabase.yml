name: Deploy Supabase Edge Functions

# Needs repository secret SUPABASE_ACCESS_TOKEN (supabase.com > Account > Access Tokens).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xjfttraweunhwxlgeagz
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        # The function checks the caller's session and role itself.
        run: supabase functions deploy admin-users --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Explain missing token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "Add the SUPABASE_ACCESS_TOKEN repository secret to deploy Edge Functions."
