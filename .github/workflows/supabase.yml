name: Supabase

# Database changes and the admin-users Edge Function go live from GitHub, nobody runs SQL by hand.
#
# - Pull request that touches supabase/: "check" builds a fresh local Supabase database in the runner
#   and applies every file in supabase/migrations/ in order. A broken migration fails here, before merge.
# - Merge to main (or "Run workflow" on the Actions tab): "deploy" applies the migrations the live
#   project has not had yet (supabase db push), then deploys the Edge Functions.
#
# Repository secrets (Settings > Secrets and variables > Actions), see docs/supabase-deploy.md:
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the project's database password
#   SUPABASE_PROJECT_REF   optional, defaults to Pingo's project xjfttraweunhwxlgeagz
#
# Demo content in supabase/seed/ is never applied by this workflow.

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

# Never run two deploys against the live database at the same time.
concurrency:
  group: supabase-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  check:
    name: Check migrations on a fresh database
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Apply all migrations to a local Supabase database
        run: supabase db start
      - name: Show applied migrations
        run: supabase migration list --local
      - name: Stop
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Apply migrations and deploy functions to live
    # Only main goes live, also when started by hand from the Actions tab.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'xjfttraweunhwxlgeagz' }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See docs/supabase-deploy.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link the live project
        run: supabase link --project-ref "$PROJECT_REF"

      # One-time baseline, safe to repeat. Migrations 0001-0014 were run by hand in the SQL Editor
      # before this workflow existed (checked against the live database on 2026-11-22), and two of
      # them were recorded under timestamp versions. This marks 0001-0014 as applied WITHOUT running
      # them again and removes the two timestamp entries. It only touches the migration history table.
      # Do not add newer migrations to this list: they are applied by "db push" below.
      - name: Baseline migration history (hand-run 0001-0014)
        run: |
          supabase migration repair --linked --status reverted 20261120122148 20261120132338
          supabase migration repair --linked --status applied \
            0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013 0014

      - name: Migrations still to apply
        run: supabase db push --linked --dry-run
      - name: Apply new migrations
        run: supabase db push --linked --yes
      - name: Deploy Edge Functions
        # admin-users checks the caller's session and role itself (see supabase/config.toml).
        run: supabase functions deploy admin-users --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Migration history now
        run: supabase migration list --linked
